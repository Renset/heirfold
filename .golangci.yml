version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
  settings:
    gosec:
      excludes:
        # G115 reports integer conversions that the code bounds explicitly.
        - G115
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
